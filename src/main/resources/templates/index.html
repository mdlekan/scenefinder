<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SceneFinder Colorado</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">🏔</span>
        <span>SceneFinder</span>
    </div>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/map}">Map</a>

        <span sec:authorize="isAuthenticated()">
            Welcome, <span sec:authentication="name">username</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="nav-link-button">Logout</button>
            </form>
        </span>

        <span sec:authorize="isAnonymous()">
            <a th:href="@{/login}">Login</a>
            <a th:href="@{/register}">Register</a>
        </span>
    </div>
</nav>

<div class="hero">
    <h1>Find Your Perfect Scene</h1>
    <p>Curated locations across Colorado for plein air painters and photographers</p>
    <a th:href="@{/map}" class="btn-primary">Explore the Map</a>
</div>

<div class="stats">
    <div class="stat">
        <span class="stat-number">30+</span>
        <span class="stat-label">Curated Locations</span>
    </div>
    <div class="stat">
        <span class="stat-number">10</span>
        <span class="stat-label">Colorado Regions</span>
    </div>
    <div class="stat">
        <span class="stat-number">4</span>
        <span class="stat-label">Seasons Covered</span>
    </div>
</div>
</body>
</html>
