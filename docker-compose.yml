version: '3.8'

services:
  # PostGIS Database
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: scenefinder-db
    restart: always
    environment:
      POSTGRES_DB: scenefinder
      POSTGRES_USER: scenefinder_user
      POSTGRES_PASSWORD: scenefinder_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenefinder_user -d scenefinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scenefinder-app
    restart: always
    ports:
      - "8080:8080"
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/scenefinder
        SPRING_DATASOURCE_USERNAME: scenefinder_user
        SPRING_DATASOURCE_PASSWORD: scenefinder_password
        SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
        SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local