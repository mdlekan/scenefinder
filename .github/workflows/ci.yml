name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Spin up PostGIS container on the runner host
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_DB: scenefinder
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Check out source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 with Gradle caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Grant execute permission to Gradle wrapper
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 4: Run unit & integration tests against PostGIS
      - name: Run Unit Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/scenefinder
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgrespassword
        run: ./gradlew test --no-daemon

      # Step 5: Set up Docker Buildx for container creation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Test building the Docker image
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: scenefinder-app:latest