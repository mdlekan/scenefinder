name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 JDK with native Gradle caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Grant execute permission to Gradle wrapper
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 4: Run unit tests using Gradle
      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      # Step 5: Set up Docker Buildx (enables modern build caching features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Test building the multi-stage Docker image
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # Build-only mode for now; set to true once pushing to AWS ECR
          tags: scenefinder-app:latest